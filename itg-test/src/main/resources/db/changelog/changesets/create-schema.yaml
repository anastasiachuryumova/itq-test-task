databaseChangeLog:
- changeSet:
    id: 1
    author: A. Churyumova
    changes:
      - sql:
          dbms: postgresql
          splitStatements: true
          endDelimiter: ";"
          sql: "CREATE SCHEMA IF NOT EXISTS itq_task;"
    rollback:
      - sql:
          dbms: postgresql
          splitStatements: true
          endDelimiter: ";"
          sql: "DROP SCHEMA IF EXISTS itq_task;"
